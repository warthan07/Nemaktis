[project]
name = "nemaktis"
version = "1.4.10"
description = "An open-source platform for light propagation in birefringent media"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Guilhem Poy", email = "guilhem.poy@umontpellier.fr" },
]
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
]

[project.urls]
Homepage = "https://nemaktis.readthedocs.io/en/latest"
Documentation = "https://nemaktis.readthedocs.io/en/latest"
Repository = "https://github.com/warthan07/nemaktis"


######################################
# Build wheel with scikit-build-core #
######################################

[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
logging.level = "INFO"
editable.rebuild = true
build-dir = "bin"
build.verbose = false
cmake.args = ["-GNinja", "--no-warn-unused-cli"]
cmake.build-type = "Release"
wheel.packages = ["HighLevelPythonInterface/nemaktis", "dtmm/dtmm"]

[[tool.scikit-build.generate]]
path = "nemaktis/__init__.py"
template-path = "HighLevelPythonInterface/nemaktis/__init__.py"

[tool.pytest]
addopts = ["-x", "-v"]
testpaths = ["HighLevelPythonInterface/tests"]


###########################
# Dev workspace with pixi #
###########################

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
preview = ["pixi-build"]

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*", channels = ["https://prefix.dev/conda-forge"] }
config = { compilers = ["cxx"] }
target.win-64.config = { compilers = ["clang-cl"] }

[tool.pixi.workspace.target.linux.build-variants]
cxx_compiler = ["gxx"]
cxx_compiler_version = ["14"]
c_stdlib = ["sysroot"]
c_stdlib_version = ["2.17"]

[tool.pixi.workspace.target.osx.build-variants]
cxx_compiler = ["clangxx"]
cxx_compiler_version = ["19"]
c_stdlib = ["macosx_deployment_target"]
c_stdlib_version = ["11.0"]
llvm_openmp = ["19"]

[tool.pixi.workspace.target.win.build-variants]
cxx_compiler = ["vs2022"]
c_stdlib = ["vs"]

[tool.pixi.package.build-dependencies]
cmake = ">=3.15"
ninja = "*"

[tool.pixi.package.host-dependencies]
python = "3.12.*"
scikit-build-core = "*"
boost = "1.85.*"
muparser = "*"
pyfftw = "*"
fftw = "*"
vtk = "*"
eigen = "*"
numpy = "*"
pkgconfig = "*"
swig = "*"

[tool.pixi.package.run-dependencies]
python = "3.12.*"
libboost = "1.85.*"
pyfftw = "*"
numba = "*"
scipy = "*"
matplotlib-base = "*"
pyqt = "*"
traits = "*"
traitsui = "*"
ipython = "*"

[tool.pixi.dev]
nemaktis = { path = "." }

[tool.pixi.dependencies]
pip = "*"
pytest = "*"

[tool.pixi.target.linux.activation.env]
NUMPY_INCLUDE_DIR = "$(python -c 'import numpy; print(numpy.get_include())')"
OMP_INCLUDE_DIR = "$(ls -d ${CONDA_PREFIX}/lib/gcc/x86_64-conda-linux-gnu/*)/include"

[tool.pixi.tasks]
build-editable = "pip install --no-build-isolation -ve $PIXI_PROJECT_ROOT"
